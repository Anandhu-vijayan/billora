name: Temporary lockfile refresh

on:
  push:
    branches:
      - hardening/production-readiness-50-100-users

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/production-readiness-50-100-users
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Resolve the updated dependency graph
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify clean installation
        run: npm ci
      - name: Verify production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Commit regenerated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): refresh lockfile for security fixes"
          git push origin hardening/production-readiness-50-100-users
